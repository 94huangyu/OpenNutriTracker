&lt;script&gt;(() =&gt; {

  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

    &quot;codex-visualization-widget-state&quot;,
  );

      {

    );

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      privateContent: null,
      ...parsedState,

    }

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

        ]);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {

    }

        id = decodeURIComponent(href.slice(1));

      }

              &lt;div class=&quot;section-line&quot;&gt;&lt;strong id=&quot;sj-results-label&quot;&gt;搜索结果&lt;/strong&gt;&lt;span id=&quot;sj-results-count&quot;&gt;1 项&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;shiji-compare&#x27;);
  const state = { radius:16, spacing:16, bodyWeight:&#x27;常规&#x27;, search:&#x27;米饭&#x27;, filter:&#x27;搜索&#x27;, day:&#x27;2026-10-15&#x27;, meal:&#x27;breakfast&#x27;, view:&#x27;home&#x27;, editing:false };
  const mealNames = { breakfast:&#x27;早餐&#x27;, lunch:&#x27;午餐&#x27;, dinner:&#x27;晚餐&#x27;, snack:&#x27;零食&#x27; };
  let selected = new Set();
  let toast = null;
  let sequence = 10;
  const store = { &#x27;2026-10-15&#x27;: {
    breakfast:[
      {id:&#x27;toast&#x27;,name:&#x27;全麦吐司&#x27;,quantity:&#x27;30 g&#x27;,kcal:80,carbs:13.8,protein:2.8,fat:1.4},
      {id:&#x27;milk&#x27;,name:&#x27;低脂牛奶&#x27;,quantity:&#x27;100 ml&#x27;,kcal:40,carbs:4.8,protein:3.4,fat:0.8}
    ],
    lunch:[
      {id:&#x27;rice&#x27;,name:&#x27;米饭&#x27;,quantity:&#x27;150 g&#x27;,kcal:174,carbs:38.4,protein:3.6,fat:0.5},
      {id:&#x27;chicken&#x27;,name:&#x27;黑椒香煎鸡胸肉（去皮、少油）&#x27;,quantity:&#x27;80 g&#x27;,kcal:132,carbs:0,protein:24,fat:4},
      {id:&#x27;broccoli&#x27;,name:&#x27;清炒西兰花&#x27;,quantity:&#x27;120 g&#x27;,kcal:69,carbs:6,protein:3.6,fat:3.4}
    ], dinner:[],snack:[]
  } };
  const restored = window.openai?.widgetState?.modelContent;
  if (restored &amp;&amp; typeof restored === &#x27;object&#x27;) {
    if (typeof restored.search === &#x27;string&#x27;) state.search = restored.search;
    if ([&#x27;搜索&#x27;,&#x27;最近&#x27;,&#x27;收藏&#x27;].includes(restored.filter)) state.filter = restored.filter;
  }
  function remember() {
    window.openai?.setWidgetState?.({ modelContent:{ homeLayout:&#x27;四餐合并分组&#x27;, search:state.search, filter:state.filter, meal:state.meal, view:state.view }, privateContent:null })?.catch(() =&gt; {});
  }
  const escape = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const dateLabel = day =&gt; { const [y,m,d]=day.split(&#x27;-&#x27;).map(Number); return `${y}年${m}月${d}日`; };
  function records(day=state.day,meal=state.meal) { return store[day]?.[meal] || []; }
  function sum(items,key) { return items.reduce((total,item) =&gt; total+item[key],0); }
  function getDay(day) { return store[day] ||= {breakfast:[],lunch:[],dinner:[],snack:[]}; }
  function renderMeals() {
    const dayItems=Object.keys(mealNames).flatMap(meal=&gt;records(state.day,meal));
    root.querySelector(&#x27;#sj-home-date&#x27;).textContent=dateLabel(state.day).replace(/^\d+年/,&#x27;&#x27;);
    root.querySelector(&#x27;#sj-full-date&#x27;).textContent=dateLabel(state.day);
    root.querySelector(&#x27;#sj-day-kcal&#x27;).textContent=sum(dayItems,&#x27;kcal&#x27;);
    for(const nutrient of [&#x27;carbs&#x27;,&#x27;protein&#x27;,&#x27;fat&#x27;]) root.querySelector(&#x27;#sj-day-&#x27;+nutrient).textContent=sum(dayItems,nutrient).toFixed(1);
    root.querySelector(&#x27;#sj-meal-group&#x27;).innerHTML=Object.entries(mealNames).map(([meal,name])=&gt;{
      const items=records(state.day,meal), names=items.map(item=&gt;item.name).join(&#x27;、&#x27;);
      return `&lt;div class=&quot;group-meal&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;group-open cursor-interaction&quot; data-open-meal=&quot;${meal}&quot; aria-label=&quot;查看${name}详情&quot; data-tooltip=&quot;${escape(names || &#x27;尚未记录&#x27;)}&quot;&gt;&lt;span class=&quot;group-main&quot;&gt;&lt;span class=&quot;group-top&quot;&gt;&lt;span class=&quot;group-name&quot;&gt;${name}&lt;/span&gt;&lt;span class=&quot;group-energy&quot;&gt;${sum(items,&#x27;kcal&#x27;)} &lt;small&gt;kcal&lt;/small&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;group-foods&quot;&gt;${escape(names || &#x27;尚未记录&#x27;)}&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;group-add cursor-interaction&quot; data-add-meal=&quot;${meal}&quot; aria-label=&quot;添加${name}记录&quot;&gt;&lt;span&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    root.querySelector(&#x27;#sj-home-scene&#x27;).hidden=state.view!==&#x27;home&#x27;;
    root.querySelector(&#x27;#sj-detail-scene&#x27;).hidden=state.view!==&#x27;detail&#x27;;
    const items=records();
    root.querySelector(&#x27;#sj-detail-title&#x27;).textContent=mealNames[state.meal];
    root.querySelector(&#x27;#sj-detail-date&#x27;).textContent=dateLabel(state.day);
    root.querySelector(&#x27;#sj-meal-kcal&#x27;).textContent=sum(items,&#x27;kcal&#x27;);
    for(const nutrient of [&#x27;carbs&#x27;,&#x27;protein&#x27;,&#x27;fat&#x27;]) root.querySelector(&#x27;#sj-meal-&#x27;+nutrient).textContent=sum(items,nutrient).toFixed(1);
    root.querySelector(&#x27;#sj-edit-toggle&#x27;).textContent=state.editing?&#x27;完成&#x27;:&#x27;编辑&#x27;;
    root.querySelector(&#x27;#sj-edit-toggle&#x27;).disabled=!items.length;
    root.querySelector(&#x27;#sj-record-count&#x27;).textContent=state.editing?`已选择 ${selected.size} 项`:`食品记录 · ${items.length} 项`;
    root.querySelector(&#x27;#sj-select-all-label&#x27;).hidden=!state.editing;
    root.querySelector(&#x27;#sj-select-all&#x27;).checked=!!items.length&amp;&amp;items.every(item=&gt;selected.has(item.id));
    root.querySelector(&#x27;#sj-edit-actions&#x27;).hidden=!state.editing;
    root.querySelector(&#x27;#sj-detail-add&#x27;).hidden=state.editing;
    root.querySelector(&#x27;#sj-delete-open&#x27;).disabled=!selected.size;
    root.querySelector(&#x27;#sj-copy-open&#x27;).disabled=!selected.size;
    root.querySelector(&#x27;#sj-record-list&#x27;).innerHTML=items.length?items.map(item=&gt;`&lt;div class=&quot;record&quot;&gt;&lt;label class=&quot;${state.editing?&#x27;cursor-interaction&#x27;:&#x27;&#x27;}&quot;&gt;${state.editing?`&lt;input type=&quot;checkbox&quot; data-record=&quot;${escape(item.id)}&quot; aria-label=&quot;选择${escape(item.name)}&quot; ${selected.has(item.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;`:&#x27;&lt;span class=&quot;record-mark&quot;&gt;&lt;i data-lucide=&quot;utensils&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27;}&lt;span class=&quot;record-body&quot;&gt;&lt;span class=&quot;record-name&quot;&gt;${escape(item.name)}&lt;/span&gt;&lt;span class=&quot;record-quantity&quot; style=&quot;display:block&quot;&gt;${escape(item.quantity)}&lt;/span&gt;&lt;span class=&quot;record-macros&quot;&gt;碳水 ${item.carbs.toFixed(1)} · 蛋白质 ${item.protein.toFixed(1)} · 脂肪 ${item.fat.toFixed(1)} g&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;record-kcal&quot;&gt;${item.kcal}&lt;small&gt; kcal&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;detail-empty&quot;&gt;这一餐还没有食品记录&lt;/div&gt;&#x27;;
    for(const id of [&#x27;sj-home-toast&#x27;,&#x27;sj-detail-toast&#x27;]) {
      const element=root.querySelector(&#x27;#&#x27;+id);
      element.hidden=!toast;
      element.innerHTML=toast?`&lt;span&gt;${escape(toast.message)}&lt;/span&gt;${toast.target?&#x27;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-view-target&gt;查看目标餐次&lt;/button&gt;&#x27;:&#x27;&#x27;}`:&#x27;&#x27;;
    }
    if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }
  function render() {
    root.querySelectorAll(&#x27;.new&#x27;).forEach(el =&gt; {
      el.style.setProperty(&#x27;--sj-radius&#x27;,state.radius+&#x27;px&#x27;);
      el.style.setProperty(&#x27;--sj-space&#x27;,state.spacing+&#x27;px&#x27;);
      el.style.setProperty(&#x27;--sj-body-weight&#x27;,state.bodyWeight===&#x27;常规&#x27;?&#x27;400&#x27;:&#x27;500&#x27;);
    });
    renderMeals();
